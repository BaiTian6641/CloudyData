name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source:
    name: Source, tokens, catalog hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generated token drift
        run: python3 tools/generate_tokens.py --check
      - name: Declared token contrast
        run: python3 tools/check_token_contrast.py
      - name: Pinned renderer assets
        run: python3 tools/build_vega_assets.py --check
      - name: Shell syntax
        run: bash -n tools/build_duckdb_android.sh

  android:
    name: Android build, lint, JVM tests
    runs-on: ubuntu-latest
    needs: source
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_NDK: ${{ github.workspace }}/android-sdk/ndk/28.2.13676358
      ANDROID_PLATFORM: android-35
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle.kts') }}
      - name: Install Android SDK, build tools, NDK
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.2.13676358"
      - name: Build pinned native engine
        run: tools/build_duckdb_android.sh
      - name: Assemble, lint, JVM tests
        run: ./gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest
      - name: Verify generated native libraries
        run: |
          set -euo pipefail
          stat -c '%n %s' app/src/main/jniLibs/*/libduckdb.so
          sha256sum app/src/main/jniLibs/*/libduckdb.so
          "$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            -l app/src/main/jniLibs/arm64-v8a/libduckdb.so | grep LOAD
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cloudydata-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

# Device/emulator instrumentation, physical input, TalkBack and Tableau
# differential checks are separate qualification lanes. They are not replaced
# by this hosted build.
