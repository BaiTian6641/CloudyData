customization:
  - id: CUST01
    area: Data and view
    controls: [aggregation, disaggregation, date_level, filter_scope, top_n, sort, missing_values, bins, facets]
    status: partial
    note: Fixed aggregate selector and sort direction only.
  - id: CUST02
    area: Titles
    controls: [chart_title, subtitle, caption, axis_titles, units, legend_title]
    status: partial
    note: Persisted chart, X/Y-axis and legend titles exist. Subtitle, caption, units and axis-title placement are pending.
  - id: CUST03
    area: Axes and scales
    controls: [range, zero_baseline, log, reverse, ticks, dual_axis, synchronize]
    status: partial
    note: Y range, zero baseline, log (positive-value validation), reverse and X/Y titles are implemented. Tick counts, dual axes, synchronization and temporal x scaling are pending.
  - id: CUST04
    area: Gridlines and dividers
    controls: [major_gridlines, minor_gridlines, color, width, row_dividers, column_dividers]
    status: partial
    note: Value-axis major gridlines can be shown/hidden; styling, minor grids and crosstab dividers are absent.
  - id: CUST05
    area: Legend
    controls: [show_hide, position, orientation, title, mark_sample, interactive]
    status: partial
    note: Multi-series line legend with show/hide, bottom/right position and title exists. Interactive filtering and custom mark samples are pending.
  - id: CUST06
    area: Labels
    controls: [show_hide, field, position, font, format, collision_policy]
    status: partial
    note: Numeric value labels can be shown above bars; field selection/position/font/format/collision policy are absent.
  - id: CUST07
    area: Color and palette
    controls: [categorical, sequential, diverging, custom, opacity, stable_category_key, missing_pattern]
    status: partial
    note: Auto categorical hash mapping; no custom/sequential/diverging controls or persisted mapping.
  - id: CUST08
    area: Marks and lines
    controls: [size, shape, line_width, line_style, interpolation, markers, opacity, border, stacking]
    status: partial
    note: Linear line, 2 dp stroke and automatic observed-point markers up to 200 points; style/interpolation/marker controls are pending.
  - id: CUST09
    area: Layers and dual axis
    controls: [add_layer, reorder_layer, per_layer_mark, per_layer_axis, remove_layer]
    status: not_started
  - id: CUST10
    area: Reference and statistics
    controls: [reference_line, reference_band, distribution, trend, forecast, cluster, confidence]
    status: not_started
  - id: CUST11
    area: Annotations
    controls: [mark_annotation, point_annotation, region_annotation, text]
    status: not_started
  - id: CUST12
    area: Tooltips
    controls: [fields, format, show_hide, bounded_values]
    status: not_started
    note: Exact values are available in the table and inspector; no chart tooltip.
  - id: CUST13
    area: Selection and inspect
    controls: [select, additive, range, lasso, keep_exclude, drill, view_data]
    status: partial
    note: Click and arrow selection map to the exact source table row; Escape releases WebView focus. Additive/range/lasso/keep-exclude/drill, visual mark highlight and tooltip remain absent.
  - id: CUST14
    area: Layout and export
    controls: [size, fit, zoom, padding, border, background, png, svg, pdf, print]
