customization:
  - id: CUST01
    area: Data and view
    controls: [aggregation, disaggregation, date_level, filter_scope, top_n, sort, missing_values, bins, facets]
    status: partial
    note: Fixed aggregate selector and sort direction only.
  - id: CUST02
    area: Titles
    controls: [chart_title, subtitle, caption, axis_titles, units, legend_title]
    status: partial
    note: Persisted chart, X/Y-axis and legend titles exist. Bounded subtitle and caption are rendered natively and carried into SVG/PNG/PDF provenance. A short units suffix and persisted X/Y axis-title alignment are applied to chart, table, tooltip and PDF labels. Subtitle/caption formatting and device visual qualification remain pending.
  - id: CUST03
    area: Axes and scales
    controls: [range, zero_baseline, log, reverse, ticks, dual_axis, synchronize]
    status: partial
    note: Y range, zero baseline, log (positive-value validation), reverse, X/Y titles, a persisted Y tick count (2–50, greedy label overlap), bounded categorical X-label thinning (2–50, first/last retained via axis.values) and an optional 0.5–3 dp major-gridline width are implemented. Gridline color styling, dual axes, synchronization and temporal x scaling are pending.
  - id: CUST04
    area: Gridlines and dividers
    controls: [major_gridlines, minor_gridlines, color, width, row_dividers, column_dividers]
    status: partial
    note: Value-axis major gridlines can be shown/hidden with a persisted 0.5–3 dp width and a bounded divider/outline contrast choice. An optional muted minor-grid axis is implemented; arbitrary gridline colors and crosstab dividers are absent.
  - id: CUST05
    area: Legend
    controls: [show_hide, position, orientation, title, mark_sample, interactive]
    status: partial
    note: Multi-series line legend with show/hide, bottom/right position, title, persisted vertical/horizontal/automatic orientation, pointer series toggles, an accessible Series menu/reset, and presentation-only hidden marks exists. Hidden state is persisted per worksheet with stale-key sanitization; marker and line legend samples are selectable.
  - id: CUST06
    area: Labels
    controls: [show_hide, field, position, font, format, collision_policy]
    status: partial
    note: Numeric value labels can be shown for Bar/Line/Area with a persisted 8–16 font size and an optional 0–6 fixed-decimal display format shared by value labels and the Y axis. Bar labels additionally support a persisted TOP/INSIDE_END position with sign/reversal-aware placement, zero/short-bar fallback/clamping and on-fill contrast halo; Line/Area stay TOP. Field selection, currency patterns, arbitrary collision controls and device visual qualification remain absent; fixed decimals, percent display and a bounded crowded-label auto-hide policy exist.
  - id: CUST07
    area: Color and palette
    controls: [categorical, sequential, diverging, custom, opacity, stable_category_key, missing_pattern]
    status: partial
    note: Auto categorical hash mapping; no custom/sequential/diverging controls or persisted mapping.
  - id: CUST08
    area: Marks and lines
    controls: [size, shape, line_width, line_style, interpolation, markers, opacity, border, stacking]
    status: partial
    note: Linear line, observed-point markers up to 200 points with persisted visibility and 2–12 px size, and a persisted 1–8 line width for Line/Area (Area uses it for the outline) exist. Persisted marker shape/size/visibility/opacity, linear/step/monotone interpolation, solid/dashed/dotted strokes and line/area paint opacity exist. Border/stacking and device visual qualification remain pending.
  - id: CUST09
    area: Layers and dual axis
    controls: [add_layer, reorder_layer, per_layer_mark, per_layer_axis, remove_layer]
    status: not_started
  - id: CUST10
    area: Reference and statistics
    controls: [reference_line, reference_band, distribution, trend, forecast, cluster, confidence]
    status: not_started
  - id: CUST11
    area: Annotations
    controls: [mark_annotation, point_annotation, region_annotation, text]
    status: not_started
  - id: CUST12
    area: Tooltips
    controls: [fields, format, show_hide, bounded_values]
    status: partial
    note: Bounded exact-value tooltip on selection/focus with persisted show/hide; fixed series/category/value fields and no field picker or format controls. Pointer-hover and TalkBack qualification are pending.
  - id: CUST13
    area: Selection and inspect
    controls: [select, additive, range, lasso, keep_exclude, drill, view_data]
    status: partial
    note: Click/arrow plus Ctrl/Cmd additive and Shift range selection map to exact source rows in both the chart and native result table; multi-row highlight, endpoint inspector, mark overlays, keep/exclude filters, bounded View Data with active-filter context and Escape focus exit are implemented. Rectangle/lasso drag and Ctrl-drag additive selection are implemented but their final device/product qualification was blocked by a device handoff; drill and persisted selection remain absent. Selection persistence is window/session by default per the architecture. CUST12 covers the tooltip.
  - id: CUST14
    area: Layout and export
    controls: [size, fit, zoom, padding, border, background, png, svg, pdf, print]
    status: partial
    note: Bounded SVG, PNG and frozen multi-format SAF bundle; PDF includes a searchable table and the current worksheet has a native print flow. A persisted 0–32 dp internal chart padding is applied to Vega and exports. An optional token-colored chart border is drawn natively, on the native fallback, and around the exported SVG/PNG/PDF scene. An optional transparent SVG/PNG background is implemented while the on-screen chart keeps its surface and PDF/print retain a theme background for contrast. Background color, fit/zoom, tagged PDF, multi-page dashboard/story print, remaining provider-failure injection, persisted geometry and pixel comparison are pending.
  - id: CUST15
    area: Accessibility
    controls: [native_summary, data_table, keyboard_exploration, focus_exit, screen_reader]
    status: partial
    note: Native summary/table exists; chart keyboard/TalkBack traversal is not tested.
  - id: CUST16
    area: Number and date formatting
    controls: [number_format, date_format, units, display_rounding, exact_values]
    status: partial
    note: Display formatting is separate from exact values, but no workbook format controls.
  - id: CUST17
    area: Pages and playback
    controls: [page_field, step, play, speed, trail]
    status: not_started
